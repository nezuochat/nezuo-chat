      });
    }

    if (D.kbKeepOpenChk) {
      D.kbKeepOpenChk.checked = keepKbOpen;
      D.kbKeepOpenChk.addEventListener("change", () => {
        keepKbOpen = D.kbKeepOpenChk.checked;
        safeLS.set("nz_keep_kb_open", keepKbOpen ? "true" : "false");
      });
    }

    // ⚙️ 管理者設定関連のイベントリスナー
    const adminBtn = $("admBtn");
    const adminMod = $("adminMod");
    if (adminBtn && adminMod) {
      adminBtn.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        updateAdminModalFields();
        adminMod.classList.add("show");
      });
      $("admCancel").addEventListener("pointerdown", (e) => {
        e.preventDefault();
        adminMod.classList.remove("show");
      });
      $("admSave").addEventListener("pointerdown", (e) => {
        e.preventDefault();
        // 設定をFirebaseへコミット
        db.ref("settings").update({
          isPrivate: $("admPrivate").checked,
          newEntriesDisabled: $("admStopJoin").checked,
          passcode: $("admPass").value.trim()
        }).then(() => {
          showToast("設定を保存しました。");
          adminMod.classList.remove("show");
        }).catch((err) => {
          alert("設定の保存に失敗しました：" + err.message);
        });
      });
      $("admTripAddBtn").addEventListener("pointerdown", (e) => {
        e.preventDefault();
        const inp = $("admTripInput");
        const val = inp.value.trim();
        if (!val || !val.startsWith("◆")) {
          alert("正しい形式のトリップ(例: ◆AbCdEfG)を入力してください。");
          return;
        }
        db.ref("settings/approvedTrips").push(val).then(() => {
          inp.value = "";
          showToast("事前承認トリップを追加しました。");
        });
      });
      $("admClearBtn").addEventListener("pointerdown", (e) => {
        e.preventDefault();
        if (confirm("🚨 警告：チャットログをすべて完全に消去します。この操作は取り消せません。\nよろしいですか？")) {
          db.ref("chat/official").remove()
            .then(() => {
              // 削除完了のお知らせログを1通送信
              db.ref("chat/official").push({
                u: "system",
                n: "システム",
                p: "",
                c: "#f43f5e",
                m: "[SYS]::📢 [システムお知らせ] 管理者によってチャットログがすべて初期化されました。",
                t: firebase.database.ServerValue.TIMESTAMP
              });
              showToast("ログを全消去しました。");
              adminMod.classList.remove("show");
            })
            .catch((err) => {
              alert("初期化に失敗しました：" + err.message);
            });
        }
      });
    }

    const overlay = $("zoomViewport");
    let isMouseDown = false, startX, startY;

    if (overlay) {
      overlay.addEventListener('touchstart', (e) => {
        if (e.target === D.imgViewCloseBtn) return;
        if (e.touches.length === 2) { isPanning = false; initialDistance = getDistance(e.touches[0], e.touches[1]); }
        else if (e.touches.length === 1 && scale > 1) { isPanning = true; lastPanX = e.touches[0].clientX; lastPanY = e.touches[0].clientY; }
      }, { passive: true });

      overlay.addEventListener('touchmove', (e) => {
        if (e.target === D.imgViewCloseBtn) return;
        if (e.touches.length === 2) {
          const dist = getDistance(e.touches[0], e.touches[1]); scale = Math.max(1, Math.min(5, scale * (dist / initialDistance)));
          initialDistance = dist; clampPan(); updateTransform();
        } else if (e.touches.length === 1 && isPanning) {
          panX += e.touches[0].clientX - lastPanX; panY += e.touches[0].clientY - lastPanY;
          lastPanX = e.touches[0].clientX; lastPanY = e.touches[0].clientY; clampPan(); updateTransform();
        }
      }, { passive: true });

      overlay.addEventListener('mousedown', (e) => {
        if (e.target === D.imgViewCloseBtn || scale <= 1) return;
        isMouseDown = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isMouseDown) return;
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        clampPan();
        updateTransform();
      });

      window.addEventListener('mouseup', () => { isMouseDown = false; });

      overlay.addEventListener('wheel', (e) => {
        e.preventDefault(); scale = Math.max(1, Math.min(5, scale * (e.deltaY > 0 ? 0.9 : 1.1))); clampPan(); updateTransform();
      }, { passive: false });

      overlay.addEventListener("click", (e) => { if (e.target === overlay && D.imgViewMod) D.imgViewMod.classList.remove("show"); });
      overlay.addEventListener("dblclick", () => { resetZoom(); });
    }

    function handleVisibilityChange() {
      if (document.visibilityState === "visible") {
        if (db) db.goOnline(); 
        forceSync(); 
        if (isJoined) {
          queueSetupFirebaseListeners();
        }
      } else {
        if (db) db.goOffline(); 
      }
    }
    document.addEventListener("visibilitychange", handleVisibilityChange);

    if (window.visualViewport) {
      const resizeViewport = () => {
        const height = window.visualViewport.height;
        document.documentElement.style.setProperty('--app-viewport-height', `${height}px`);
        scBottom(true);
      };
      window.visualViewport.addEventListener('resize', resizeViewport);
      window.visualViewport.addEventListener('scroll', resizeViewport);
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        closePlayer();
      }
    });

    initDirectDatabaseProcess();
  }

  function getDistance(t1, t2) {
    return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", initApp); else initApp();
