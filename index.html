<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#090d16">
<title>NEZUO CHAT</title>
<link rel="preconnect" href="https://www.youtube-nocookie.com" crossorigin>
<link rel="preconnect" href="https://embed.nicovideo.jp" crossorigin>
<link rel="preconnect" href="https://i.ytimg.com" crossorigin>
<link rel="preconnect" href="https://img.cdn.nimg.jp" crossorigin>

<!-- Firebase SDK v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#090d16;--sf:#151c2c;--s2:#0b101c;--bd:#27314f;--tx:#f1f5f9;--mu:#94a3b8;--m2:#4e5e78;--in:#4f46e5;--i2:#3b32c0;--em:#10b981;--e2:#059669;--ro:#f43f5e;--usr-color:#94a3b8;--safe:env(safe-area-inset-bottom,0px);--app-viewport-height:100dvh}
html,body{height:100dvh;width:100%;overflow:hidden;background:#05070a;color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
input,textarea,select{font-family:inherit;font-size:16px!important}

button,.chip,.btn,.jump-btn,.bsd,.bclrm,.open-player-btn,.modal-bottom-close,.msg-del-btn{
  cursor:pointer;
  font-family:inherit;
  border:none;
  background:none;
  transition:transform .08s ease, opacity .08s ease;
  touch-action:manipulation;
  will-change:transform, opacity;
}
button:active,.chip:active,.btn:active,.jump-btn:active,.bsd:active,.bclrm:active,.open-player-btn:active,.modal-bottom-close:active,.msg-del-btn:active{
  transform:scale(.92)!important;
  opacity:.75!important;
  transition:none!important;
}

#app{height:var(--app-viewport-height,100dvh);display:flex;position:fixed;inset:0;flex-direction:column;z-index:50;background:#05070a}
#cp{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden;background:#0d1117;position:relative;max-width:900px;width:100%;margin:0 auto;border-left:1px solid var(--bd);border-right:1px solid var(--bd)}
#hdr{background:var(--sf);border-bottom:1px solid var(--bd);padding:8px 12px;flex-shrink:0}
.hr{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pcnt{font-size:11px;font-weight:900;background:rgba(255,255,255,.08);padding:4px 8px;border-radius:6px;border:1px solid rgba(255,255,255,.05)}
.hbs{display:flex;gap:8px;align-items:center}
.hbs button{padding:6px 14px;height:40px;border-radius:8px;font-size:12.5px;font-weight:700;background:var(--bg);border:1px solid var(--bd);color:var(--tx);display:flex;align-items:center;gap:6px}
.bclr{border-color:var(--usr-color)!important}
.bclr-dot{width:11px;height:10px;border-radius:50%;background:var(--usr-color)!important}

.bx{
  background:rgba(244,63,94,.16)!important;
  border-color:rgba(244,63,94,.4)!important;
  color:#fda4af!important;
  font-weight:900!important;
  padding:6px 16px!important;
  display:none !important;
  align-items:center;
  justify-content:center;
}
#pl{display:flex;gap:6px;padding:6px 12px;background:var(--s2);border-bottom:1px solid rgba(255,255,255,.02);overflow-x:auto;white-space:nowrap;min-height:40px;max-height:40px}
.chip{font-size:11px;font-weight:700;padding:4px 10px;border-radius:6px;background:var(--bg);border:1px solid rgba(255,255,255,.06);display:inline-flex;align-items:center;color:var(--tx);height:28px}

#fixedPlayer{display:none;flex-direction:column;background:var(--s2);border-bottom:1px solid var(--bd);width:100%}
#playerHeader{background:var(--sf);padding:10px 14px;font-size:13px;font-weight:bold;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bd)}

#playerContent{
  width:100%;
  max-width:480px;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  margin:0 auto;
  border-radius:0 !important;
  overflow:hidden;
  transition: aspect-ratio 0.12s ease, height 0.12s ease, width 0.12s ease;
}
#playerCloseBtn{background:rgba(244, 63, 94, 0.15) !important;border:1px solid rgba(244, 63, 94, 0.4) !important;color: #fda4af !important;font-weight: 900 !important;cursor: pointer;padding: 5px 14px !important;font-size: 13px !important;border-radius: 6px;transition: all 0.12s ease;}

.player-loader {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: rgba(0,0,0,0.85);
  z-index: 10;
}

#tl{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:12px;
  background-color:#0d1117;
  will-change:scroll-position;
  -webkit-overflow-scrolling:touch;
}
#tl-inner{display:flex;flex-direction:column;justify-content:flex-end;gap:0;width:100%;max-width:800px;margin:0 auto;min-height:100%}

/* 非公開用プレースホルダー */
#privatePlaceholder{
  display:none;
  flex:1;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:32px;
  color:var(--mu);
  font-weight:bold;
  font-size:14px;
  gap:12px;
  background:#0d1117;
}

.mw{
  position:relative;
  display:flex;
  flex-direction:column;
  width:100%;
  padding:12px 14px;
  border-bottom:1px solid rgba(51,65,85,.18);
  contain-intrinsic-size: 80px;
  content-visibility: auto;
}
.mw.new-msg-anim{animation:slideInUp .06s ease-out forwards}
.mm{display:flex;align-items:center;gap:6px;font-size:12.5px;margin-bottom:6px;width:100%;overflow:hidden;white-space:nowrap}
.mm-name{font-weight:bold;overflow:hidden;text-overflow:ellipsis}
.mm-trip{font-size:11px;margin-left:2px;overflow:hidden;text-overflow:ellipsis}
.ts{color:var(--mu);opacity:.6;font-size:10px;margin-left:auto;font-family:monospace}

.mb, .mb a {
  user-select: text !important;
  -webkit-user-select: text !important;
  -webkit-touch-callout: default !important;
}

.mb{align-self:start;font-size:15px;line-height:1.6;max-width:100%;word-break:break-all;white-space:pre-wrap;color:var(--tx);padding-right:65px}
.sys-msg{position:relative;text-align:center;font-size:12px;font-weight:bold;color:var(--mu);margin:10px 0;background:rgba(255,255,255,.02);padding:10px 16px;border-radius:8px;border:1px solid rgba(255,255,255,.04);word-break:break-all;line-height:1.5}
.sys-ts{display:block;font-size:11px;color:var(--mu);opacity:.75;font-family:monospace;margin-top:6px}
#joinForm{display:none;flex-direction:column;background:var(--sf);border-top:1px solid var(--bd)}
.jrow{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:center;padding:12px}

@media (max-width:580px){
  .jrow{grid-template-columns:1fr;gap:10px}
  #joinBtn{width:100%;height:44px!important}
  #hdr{padding-right:0!important}
  .bx{
    border-radius:8px 0 0 8px!important;
    margin-right:0!important;
    border-right:none!important;
    padding:8px 20px!important;
    height:42px!important;
  }
  #ib{padding-right:0!important}
  #ibToolbar{gap:6px!important}
  .bsd{
    border-radius:24px 0 0 24px!important;
    width:60px!important;
    height:52px!important;
    border-right:none!important;
  }
}

#ib{display:none;flex-direction:column;padding:6px calc(8px + env(safe-area-inset-right,0px)) calc(6px + var(--safe)) calc(8px + env(safe-area-inset-left,0px));background:var(--sf);border-top:1px solid var(--bd);gap:6px}
#ib.show{display:flex}
#ibToolbar{width:100%;align-items:flex-end;display:flex;gap:10px}
.jump-btns{display:flex;gap:6px}

.jump-btn{width:56px;height:34px;border-radius:8px;background:var(--s2);border:1px solid var(--bd);color:var(--tx);font-size:12px;font-weight:bold;display:flex;align-items:center;justify-content:center}
.jump-btn:disabled{opacity:.3}

.mi-container{position:relative;flex:1;display:flex;align-items:center;background:var(--bg);border:1px solid var(--bd);border-radius:22px;min-height:48px;padding:4px 44px 4px 16px;transition:border-color 0.15s ease,box-shadow 0.15s ease}
.mi-container:focus-within{border-color:var(--in);box-shadow:0 0 0 3px rgba(79, 70, 229, 0.25)}
#mi{width:100%;background:none;border:none;color:var(--tx);outline:none;resize:none;font-size:15px;max-height:120px;line-height:1.5;padding:8px 0}

.bclrm{position:absolute;right:8px;width:30px;height:30px;border-radius:50%;color:var(--mu);font-size:16px;font-weight:bold;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);opacity:0;pointer-events:none;transition:all 0.15s ease}
.bclrm.show{opacity:1;pointer-events:auto}
.bclrm:hover,.bclrm:active{background:rgba(244,63,94,0.15);border-color:rgba(244,63,94,0.3);color:var(--ro)}

.bsd{width:48px;height:48px;border-radius:50%;background:var(--in);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 12px rgba(79,70,229,0.35);border:1px solid rgba(255,255,255,0.08)}
.bsd:hover{background:var(--i2)}
.bsd svg{width:20px;height:20px;transform:rotate(45deg);margin-top:-1px;margin-left:-2px}

.mod-overlay{position:fixed;inset:0;background:rgba(5,7,22,.85);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:10000;padding:12px}
.mod-overlay.show{display:flex}
.gc,.clrmc{background:var(--sf);border:1px solid var(--bd);border-radius:12px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px;padding:16px;max-height:80vh;overflow-y:auto}
.clr-prev{background:var(--bg);padding:12px;border-radius:8px;text-align:center;font-size:11px;font-weight:700}
.clr-btns{display:flex;gap:8px}
.clr-cancel,.clr-ok{flex:1;padding:11px;border-radius:8px;font-size:12.5px;font-weight:700;text-align:center}
.clr-cancel{background:var(--bg);border:1px solid var(--bd);color:var(--tx)}
.clr-ok{background:var(--in);color:#fff}
.spin{display:inline-block;width:16px;height:14px;border:2px solid rgba(255,255,255,.2);border-radius:50%;border-top-color:var(--tx);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideInUp{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
.inp{width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:10px 14px;color:var(--tx);outline:none;font-size:14px;height:42px}
.btn{padding:10px 8px;border-radius:8px;font-size:13.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
#imgViewMod{background:rgba(0,0,0,.96);backdrop-filter:blur(10px);flex-direction:column}
#imgViewMod.show{display:flex!important}
#zoomViewport{width:100%;height:calc(100dvh - 100px);position:absolute;top:0;left:0;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:grab}
#zoomViewport:active{cursor:grabbing}
#imgViewSrc{max-width:95%;max-height:95%;object-fit:contain;border-radius:0 !important;user-select:none;-webkit-user-drag:none}
.modal-bottom-close-container{width:100%;display:flex;justify-content:center;position:absolute;bottom:0;left:0;padding:16px 0 calc(16px + var(--safe))}
.modal-bottom-close{padding:12px 24px;background:var(--ro);color:#fff;border-radius:24px;font-weight:bold;font-size:14px}
.clrpick-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.clrc2{aspect-ratio:1;width:100%;max-width:24px;border-radius:50%;margin:0 auto;border:2px solid transparent}
.clrc2.sel{border-color:var(--tx)!important;transform:scale(1.25)}
#joinBtn{background:linear-gradient(135deg,var(--in),#6366f1)!important;color:#fff!important;font-weight:900!important}
#copyTripBtn{background:#0ea5e9!important;color:#fff!important;font-weight:800!important}

.inline-img{
  max-width:280px;
  max-height:280px;
  width:100%;
  height:auto;
  aspect-ratio: 16 / 10;
  object-fit: cover;
  border-radius:0 !important;
  margin-top:6px;
  border:1px solid var(--bd);
  display:block;
  cursor:zoom-in;
  transition:transform 0.12s ease,opacity 0.12s ease;
  content-visibility:auto;
  background-color:rgba(255,255,255,0.02);
}
.inline-img:hover{opacity:0.9;transform:scale(1.02)}

.media-link-container {margin-top:8px;background:rgba(11, 16, 28, 0.6);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;display:inline-flex;flex-direction:column;gap:6px;max-width:100%}
.media-inline-row {display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.media-badge {font-size:10px;font-weight:900;color:#fff;padding:3px 8px;border-radius:4px;letter-spacing:0.5px}
.open-player-btn {font-size:11.5px;font-weight:800;color:#38bdf8;background:rgba(56, 189, 248, 0.1);border:1px solid rgba(56, 189, 248, 0.3);padding:5px 12px;border-radius:6px;transition:all 0.12s ease}

.msg-del-btn {
  position: absolute;
  right: 14px;
  bottom: 8px;
  background: rgba(244, 63, 94, 0.1) !important;
  border: 1px solid rgba(244, 63, 94, 0.25) !important;
  color: #fda4af !important;
  font-size: 11px !important;
  font-weight: bold !important;
  border-radius: 4px;
  padding: 3px 8px !important;
  transition: all 0.1s ease;
  z-index: 5;
}
.msg-del-btn:hover {
  background: rgba(244, 63, 94, 0.22) !important;
  border-color: rgba(244, 63, 94, 0.45) !important;
}

#toastContainer {
  position: fixed;
  bottom: calc(70px + var(--safe));
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(15, 23, 42, 0.95);
  border: 1px solid var(--bd);
  color: var(--tx);
  padding: 10px 18px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: bold;
  z-index: 100000;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  pointer-events: none;
  opacity: 0;
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease;
  display: none;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
}
#toastContainer.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* 管理設定エリア内の小規模スタイル */
.adm-sec-title {
  font-size: 11px;
  font-weight: bold;
  color: var(--mu);
  margin-top: 8px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  padding-bottom: 3px;
}
</style>
</head>
<body>
<div id="app">
  <div id="cp">
    <div id="hdr">
      <div class="hr">
        <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span class="logo">NEZUO CHAT</span>
            <span class="pcnt" id="pcnt" style="display: none;"></span>
          </div>
        </div>
        <div class="hbs">
          <!-- 管理パネルボタン（管理者ログイン時のみJSで自動表示） -->
          <button class="bclr" id="admBtn" style="display: none; background: var(--in); border-color: var(--in); color: #fff;" title="管理設定"><span class="bclr-dot" style="background:#fff!important;"></span> ⚙️ 管理パネル</button>
          <button class="bclr" id="clrBtn" title="色設定"><span class="bclr-dot" id="clrDot"></span> 色設定</button>
          <button class="bx" id="exBtn" title="退室">退室</button>
        </div>
      </div>
    </div>

    <div id="pl"></div>

    <div id="fixedPlayer">
      <div id="playerHeader">
        <span id="playerTitle">📺 インライン再生プレイヤー</span>
        <button id="playerCloseBtn" title="プレイヤーを閉じる(Esc)">閉じる</button>
      </div>
      <div id="playerContent"></div>
    </div>

    <!-- 非公開時のプレースホルダー -->
    <div id="privatePlaceholder">
      <div style="font-size: 32px; filter: grayscale(1);">🔒</div>
      <div>このチャットルームは現在非公開です。<br><span style="font-size: 12px; font-weight: normal; color: var(--mu); margin-top: 4px; display: block;">入室するとログと参加者一覧を閲覧できます。</span></div>
    </div>

    <div id="tl" role="log" aria-live="polite">
      <div id="tl-inner"></div>
    </div>

    <div id="ibTopBar" style="background: var(--sf); border-top: 1px solid var(--bd); padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-shrink: 0;">
      <div style="display: flex; align-items: center; gap: 6px; height: 34px;">
        <div id="kbKeepOpenContainer" style="display: none; align-items: center; gap: 6px;">
          <input type="checkbox" id="kbKeepOpenChk" style="width: 15px; height: 15px; accent-color: var(--in); cursor: pointer;">
          <label for="kbKeepOpenChk" style="font-size: 11.5px; font-weight: bold; color: var(--tx); cursor: pointer; user-select: none; white-space: nowrap;">発言後にキーボードを開いたままにする</label>
        </div>
      </div>
      <div class="jump-btns">
        <button class="jump-btn" id="jumpUpBtn" title="最上部(100件の最古ログ)へ" disabled>▲</button>
        <div style="position: relative; display: inline-block;">
          <button class="jump-btn" id="jumpDownBtn" title="タイムラインの最下部へ" disabled>▼</button>
          <span id="unreadBadge" style="display: none; position: absolute; top: -6px; right: -6px; background: var(--ro); color: #fff; font-size: 9px; font-weight: bold; border-radius: 10px; min-width: 18px; height: 18px; padding: 0 4px; align-items: center; justify-content: center; line-height: 1; border: 1.5px solid var(--sf); box-shadow: 0 2px 5px rgba(0,0,0,0.3); pointer-events: none; z-index: 5;">0</span>
        </div>
      </div>
    </div>

    <div id="joinForm" style="display: none; flex-direction: column; padding: 14px; gap: 10px; border-top: 1px solid var(--bd); background: var(--sf); padding-bottom: calc(14px + var(--safe));">
      <div class="jrow">
        <input type="text" id="ni" class="inp" placeholder="名前 (10文字まで)" maxlength="10" autocomplete="off">
        <input type="text" id="tripi" class="inp" placeholder="トリップキー (任意)" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
        <button class="btn bp" id="joinBtn" style="height: 42px; padding: 0 16px;">参加する</button>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 8px;">
        <span id="tripPrevText" style="font-size: 11.5px; font-weight: bold; color: var(--usr-color); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;">トリッププレビュー: 名無し</span>
        <button id="copyTripBtn" class="btn bq" style="height: 26px; padding: 0 10px; font-size: 11px; border-radius: 6px; display: none; align-items: center; justify-content: center; font-weight: bold; border-color: rgba(255,255,255,0.1); flex-shrink: 0;" title="トリップをクリップボードにコピー">トリップをコピー</button>
      </div>
    </div>

    <div id="ib">
      <div id="ibToolbar">
        <div class="mi-container">
          <textarea id="mi" rows="1" placeholder="メッセージを入力..." maxlength="500"></textarea>
          <button class="bclrm" id="clrMsgBtn" title="クリア">×</button>
        </div>
        <button class="bsd" id="sdBtn" aria-label="送信">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
          </svg>
        </button>
      </div>
    </div>

  </div>
</div>

<div id="toastContainer" style="display:none;"></div>

<!-- 色設定モーダル -->
<div id="clrmod" class="mod-overlay">
  <div class="clrmc gc" style="max-width:320px;">
    <h3 style="font-size:13px; color:var(--tx); border-bottom:1px solid var(--bd); padding-bottom:6px; font-weight:bold;">🎨 色設定</h3>
    <div id="clrPrev" class="clr-prev" style="margin:8px 0; min-height:48px;"></div>
    <div class="clrbox" style="margin-bottom:10px;">
      <div class="clrpick-grid" id="clrPick2"></div>
    </div>
    <div class="clr-btns">
      <button class="clr-cancel" id="clrCancel">キャンセル</button>
      <button class="clr-ok" id="clrOk">適用</button>
    </div>
  </div>
</div>

<!-- 拡大画像モーダル -->
<div id="imgViewMod" class="mod-overlay">
  <div id="zoomViewport">
    <img id="imgViewSrc" alt="拡大画像">
  </div>
  <div class="modal-bottom-close-container">
    <button class="modal-bottom-close" id="imgViewCloseBtn">閉じる</button>
  </div>
</div>

<!-- ⚙️ 管理者パネルモーダル -->
<div id="adminMod" class="mod-overlay">
  <div class="gc" style="max-width:380px;">
    <h3 style="font-size:13.5px; color:var(--tx); border-bottom:1px solid var(--bd); padding-bottom:6px; font-weight:bold;">⚙️ 管理者コントロールパネル</h3>
    
    <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 6px;">
      
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size:12px; font-weight:bold;">🔒 非公開モード (ログと一覧を非入室者に隠す)</span>
        <input type="checkbox" id="admPrivate" style="width: 16px; height: 16px; accent-color: var(--in); cursor: pointer;">
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size:12px; font-weight:bold;">🚫 新規入室停止 (承認トリップ以外を拒否)</span>
        <input type="checkbox" id="admStopJoin" style="width: 16px; height: 16px; accent-color: var(--in); cursor: pointer;">
      </div>

      <div>
        <label for="admPass" style="font-size:11px; font-weight:bold; color:var(--mu); display:block; margin-bottom:4px;">🔑 入室合言葉 (空欄で合言葉ロック解除)</label>
        <input type="text" id="admPass" class="inp" placeholder="例: hito-koto" autocomplete="off" style="height:36px; font-size:13px;">
      </div>

      <div>
        <label style="font-size:11px; font-weight:bold; color:var(--mu); display:block; margin-bottom:4px;">📋 事前承認トリップ登録</label>
        <div style="display: flex; gap: 6px;">
          <input type="text" id="admTripInput" class="inp" placeholder="例: ◆AbCdEfG123" autocomplete="off" style="height:36px; font-size:13px; flex: 1;">
          <button class="btn" id="admTripAddBtn" style="background:var(--in); color:#fff; width: 60px; font-size: 12px; height:36px;">追加</button>
        </div>
        <div id="admTripList" style="background:var(--s2); border:1px solid var(--bd); border-radius:6px; max-height:80px; overflow-y:auto; padding:6px; margin-top:6px; font-size:11px; display:flex; flex-direction:column; gap:4px; font-family: monospace;">
          <!-- 承認リストがJSでここに入る -->
        </div>
      </div>

      <div style="margin-top: 8px; border-top: 1px solid var(--bd); padding-top: 12px;">
        <button class="btn" id="admClearBtn" style="background: var(--ro); color:#fff; width: 100%; height:38px; font-weight:bold; font-size: 12px;">🚨 チャットログをすべて初期化</button>
      </div>

    </div>

    <div class="clr-btns" style="margin-top: 14px;">
      <button class="clr-cancel" id="admCancel">閉じる</button>
      <button class="clr-ok" id="admSave" style="background: var(--em);">設定を保存</button>
    </div>
  </div>
</div>

<script>
(function() {
  const ADMIN_UID = "J64MocsPo0QD7hSwZpQgEeDdO6X2";

  const safeLS = {
    get(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
    set(key, val) { try { localStorage.setItem(key, val); } catch (e) {} },
    remove(key) { try { localStorage.removeItem(key); } catch (e) {} }
  };

  const firebaseConfig = {
    apiKey: "AIzaSyCsRidc0smUQDaBwq-oki5NzxSHx6-ljiw",
    authDomain: "nezuochat.firebaseapp.com",
    databaseURL: "https://nezuochat-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "nezuochat",
    storageBucket: "nezuochat.firebasestorage.app",
    messagingSenderId: "154725381397",
    appId: "1:154725381397:web:8742ccd957e20cee8ce51c"
  };

  let db = null;
  if (typeof firebase !== 'undefined') {
    try {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      if (typeof firebase.database === 'function') db = firebase.database();
    } catch (e) {
      console.error("Firebase SDK init error:", e);
    }
  }

  const $ = id => document.getElementById(id);
  let D = {};

  let myUid = safeLS.get("nz_permanent_uid") || ""; 
  if (!myUid) {
    myUid = "usr_" + Math.random().toString(36).slice(2, 12) + "_" + Date.now();
    safeLS.set("nz_permanent_uid", myUid);
  }

  let myName = safeLS.get("nz_ni") || "";
  let myTrip = "";
  let isJoined = (safeLS.get("nz_is_joined") === "true") && (myName.trim() !== ""); 

  let keepKbOpen = safeLS.get("nz_keep_kb_open") === "true";
  let isAutoScroll = true; 
  const unreadMsgIds = new Set(); 
  let _scPending = false; 
  let autoExitTimeoutId = null; 
  let serverTimeOffset = 0; 
  let isOffsetLoaded = false;
  const displayedMsgIds = new Set();
  let curColor = safeLS.get("nz_color") || "#94a3b8";
  let tmpColor = curColor;
  let lastSendTime = 0;
  let isFirstLoad = true; 
  let isFirebaseListenersBound = false; 

  let isPresenceInitialized = false;

  const maxLimit = 100;
  let currentLimit = 100;

  let latestDisplayedTs = 0;
  let scale = 1, panX = 0, panY = 0;
  let lastPanX = 0, lastPanY = 0, isPanning = false;
  let initialDistance = 0;

  let currentPresenceMap = {}; 
  let isConnectedBound = false;

  // ルームの共通設定データを保持する
  let roomSettings = {
    isPrivate: false,
    newEntriesDisabled: false,
    passcode: "",
    approvedTrips: {}
  };

  const UR = /(https?:\/\/[^\s\n<>"]+)/gi;

  const COLORS = [
    {v:"#94a3b8",n:"グレー"},{v:"#e2e8f0",n:"スレート"},{v:"#06b6d4",n:"シアン"},{v:"#7dd3fc",n:"パステルスカイ"},{v:"#38bdf8",n:"スカイ"},{v:"#6366f1",n:"インディゴ"},{v:"#818cf8",n:"パステルインディゴ"},{v:"#bef264",n:"パステルライム"},
    {v:"#a3e635",n:"ライム1"},{v:"#84cc16",n:"ライム2"},{v:"#10b981",n:"エメラルド"},{v:"#34d399",n:"ミント"},{v:"#a7f3d0",n:"パステルミント"},{v:"#2dd4bf",n:"ティール"},{v:"#99f6e4",n:"パステルティール"},{v:"#14b8a6",n:"アクア"},
    {v:"#fde68a",n:"パステルイエロー"},{v:"#fb9e0b",n:"アンバー"},{v:"#f59e0b",n:"イエロー"},{v:"#fdba74",n:"パステルオレンジ"},{v:"#fb923c",n:"オレンジ1"},{v:"#fb923c",n:"orange2"},{v:"#fca5a5",n:"パステルレッド"},{v:"#f87171",n:"レッド2"},
    {v:"#ef4444",n:"レッド1"},{v:"#db2777",n:"ローズ"},{v:"#f472b6",n:"ピンク"},{v:"#f9a8d4",n:"ライトピンク"},{v:"#fda4af",n:"パステルローズ"},{v:"#a855f7",n:"パープル"},{v:"#c084fc",n:"ライトパープル"},{v:"#c4b5fd",n:"パステルパープル"}
  ];

  const renderedMwNodes = new Map();
  let lastMsgsCache = []; 

  const setGlobalColor = c => document.documentElement.style.setProperty("--usr-color", c);
  setGlobalColor(curColor);

  const getTrueTime = () => {
    const t = Date.now() + serverTimeOffset;
    return isNaN(t) ? Date.now() : t;
  };

  const getMsgTime = (m) => {
    if (m && m.t) {
      if (typeof m.t === "number") return m.t;
      const parsed = parseInt(m.t, 10);
      return isNaN(parsed) ? getTrueTime() : parsed;
    }
    return getTrueTime();
  };

  const escapeHtml = str => typeof str !== "string" ? "" : str.replace(/[&<>'"]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t] || t));

  const fDT = (ts) => {
    if (!ts || typeof ts !== "number") return "--:--:--";
    const d = new Date(ts);
    if (isNaN(d.getTime())) return "--:--:--";
    const pad = n => String(n).padStart(2, "0");
    const weeks = ["日", "月", "火", "水", "木", "金", "土"];
    const y = d.getFullYear();
    const m = pad(d.getMonth() + 1);
    const date = pad(d.getDate());
    const w = weeks[d.getDay()];
    const h = pad(d.getHours());
    const min = pad(d.getMinutes());
    const s = pad(d.getSeconds());
    return `${y}/${m}/${date}(${w}) ${h}:${min}:${s}`;
  };

  const _0x5f2b = ["n","z","_","c","h","a","t","_","s","a","l","t","_","2","0","2","6"];
  const SYSTEM_SALT = _0x5f2b.join("");

  window.sha256 = async (str) => {
    if (typeof window !== 'undefined' && window.crypto && window.crypto.subtle) {
      try {
        const buf = new TextEncoder().encode(str);
        const hash = await window.crypto.subtle.digest("SHA-256", buf);
        return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
      } catch (e) {
        console.warn("Fallback to hash logic", e);
      }
    }
    let h1 = 0x811c9dc5, h2 = 0xcbf29ce4;
    const len = str.length;
    for (let i = 0; i < len; i++) {
      h1 = Math.imul(h1 ^ str.charCodeAt(i), 0x01000193);
      h2 = Math.imul(h2 ^ str.charCodeAt(i), 0x01000193);
    }
    return (h1 >>> 0).toString(16).padStart(8, '0') + (h2 >>> 0).toString(16).padStart(8, '0');
  };

  // 【爆速化：単発SHA-256変換に変更（キーボード入力プレビューが1ミリ秒未満で即座に同期します）】
  window.makeTrip = async (name, tripKey) => {
    if (!tripKey) return "";
    const revKey = tripKey.split("").reverse().join("");
    const mixed = SYSTEM_SALT + "_" + name + "_[SALT]_" + revKey;
    
    if (window.crypto && window.crypto.subtle) {
      try {
        const encoder = new TextEncoder();
        const data = encoder.encode(mixed);
        const hash = await window.crypto.subtle.digest("SHA-256", data);
        const hashHex = Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
        let res = "";
        for (let i = 0; i < 10; i++) {
          const val = parseInt(hashHex.substring(i * 6, i * 6 + 6), 16);
          res += chars[val % 62];
        }
        return "◆" + res;
      } catch (e) {
        console.warn("Subtle crypto fallback", e);
      }
    }
    
    const fallbackHash = await window.sha256(mixed);
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    let res = "";
    for (let i = 0; i < 10; i++) {
      const val = parseInt(fallbackHash.substring(i * 6, i * 6 + 6), 16);
      res += chars[val % 62];
    }
    return "◆" + res;
  };

  const showToast = (msg) => {
    const container = $("toastContainer");
    if (!container) return;
    container.textContent = msg;
    container.style.display = "flex";
    container.classList.remove("show");
    void container.offsetWidth; 
    container.classList.add("show");
    if (window.toastTimer) clearTimeout(window.toastTimer);
    window.toastTimer = setTimeout(() => {
      container.classList.remove("show");
      setTimeout(() => { container.style.display = "none"; }, 200);
    }, 4500); 
  };

  const updateModalColorPreview = (color) => {
    if (D.clrPrev) {
      D.clrPrev.style.color = color;
      D.clrPrev.textContent = `プレビュー: ${myName || "名無し"}${myTrip || ""}`;
    }
  };

  const handleJoinKey = (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      joinRoom();
    }
  };

  const resetZoom = () => {
    scale = 1; panX = 0; panY = 0;
    updateTransform();
  };

  const clampPan = () => {
    if (scale <= 1) { panX = 0; panY = 0; }
    else {
      const maxPan = (scale - 1) * 150;
      panX = Math.max(-maxPan, Math.min(maxPan, panX));
      panY = Math.max(-maxPan, Math.min(maxPan, panY));
    }
  };

  const updateTransform = () => {
    if (D.imgViewSrc) {
      D.imgViewSrc.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }
  };

  const updateClrMsgBtnVisibility = () => {
    if (!D.clrMsgBtn || !D.mi) return;
    D.clrMsgBtn.classList.toggle("show", D.mi.value.length > 0);
  };

  const syncProfileValues = async () => {
    const niVal = safeLS.get("nz_ni") || "", tripiVal = safeLS.get("nz_tripi") || "";
    if (D.ni && D.ni.value !== niVal) D.ni.value = niVal;
    if (D.tripi && D.tripi.value !== tripiVal) D.tripi.value = tripiVal;
    
    const trimmedNi = niVal.trim();
    if (tripiVal) {
      const tLobby = await window.makeTrip(trimmedNi || "名無し", tripiVal);
      if (D.tripPrevText) D.tripPrevText.textContent = `トリッププレビュー: ${trimmedNi || "名無し"} ${tLobby}`;
    } else {
      if (D.tripPrevText) D.tripPrevText.textContent = `トリッププレビュー: ${trimmedNi || "名無し"}`;
    }
    if (D.copyTripBtn) D.copyTripBtn.style.display = tripiVal ? "inline-flex" : "none";
    validateNameField();
  };

  function validateNameField() {
    if (!D.ni || !D.joinBtn) return;
    const empty = D.ni.value.trim() === "";
    D.joinBtn.disabled = empty;
    D.joinBtn.textContent = empty ? "名前を入力してください" : "参加する";
  }

  function switchUIMode(mode) {
    if (!D.ib || !D.joinForm || !D.exBtn || !D.clrBtn) return;
    
    if (mode === "guest") {
      D.ib.style.display = "none";
      D.joinForm.style.display = "flex";
      D.exBtn.style.setProperty("display", "none", "important"); 
      D.clrBtn.style.display = "inline-flex"; 
      const kb = $("kbKeepOpenContainer");
      if (kb) kb.style.display = "none";
      
      // 未入室時の非公開モード連動表示制限
      applyPrivateModeUI();
    } else if (mode === "joined") {
      D.ib.style.display = "flex";
      D.joinForm.style.display = "none";
      D.exBtn.style.setProperty("display", "inline-flex", "important"); 
      D.clrBtn.style.display = "inline-flex"; 
      const kb = $("kbKeepOpenContainer");
      if (kb) kb.style.display = "flex";
      
      // 入室成功時は常にチャットと一覧を可視化
      $("tl").style.display = "block";
      $("pl").style.display = "flex";
      $("privatePlaceholder").style.display = "none";
    }
  }

  // 非公開モードが有効かつ未入室時の表示制御
  function applyPrivateModeUI() {
    if (isJoined) return;
    if (roomSettings.isPrivate) {
      $("tl").style.display = "none";
      $("pl").style.display = "none";
      $("privatePlaceholder").style.display = "flex";
    } else {
      $("tl").style.display = "block";
      $("pl").style.display = "flex";
      $("privatePlaceholder").style.display = "none";
    }
  }

  const updateLastPostTime = time => safeLS.set("nz_last_post_time", time.toString());

  function startAutoExitChecker() {
    stopAutoExitTimer(); 
    if (!isJoined) return;
    
    autoExitTimeoutId = setTimeout(() => {
      doExit(true); 
    }, 1800000); 
  }

  function stopAutoExitTimer() {
    if (autoExitTimeoutId) {
      clearTimeout(autoExitTimeoutId);
      autoExitTimeoutId = null;
    }
  }

  async function doExit(isAuto = false) {
    if (!isJoined || !db) return;
    const cleanName = (myName || "").trim();
    if (!cleanName) {
      isJoined = false;
      stopAutoExitTimer();
      safeLS.remove("nz_is_joined");
      safeLS.remove("nz_last_post_time");
      if (myUid) await db.ref(`presence/official/${myUid}`).remove().catch(()=>{});
      removeFirebaseListeners(); // 通信リスナーの完全解放（セキュリティ＆高速化）
      renderPresence(currentPresenceMap);
      switchUIMode("guest");
      return;
    }
    const cleanTrip = myTrip || "", cleanUid = myUid, cleanColor = curColor;
    // 【お掃除成功：視認性の高いログへの修正】
    const logText = "[SYS]::📢 [システムお知らせ] " + `${cleanName} ${cleanTrip}`.trim() + (isAuto ? " が自動退室しました（30分間発言がなかったため）" : " が退室しました");
    const lastPost = parseInt(safeLS.get("nz_last_post_time") || "0");
    const exitTimeMillis = isAuto ? (lastPost + 30 * 60 * 1000) : getTrueTime();

    const tempId = "pnd_sys_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6);
    const tempObj = { id: tempId, u: cleanUid || "sys_exit", n: cleanName, p: cleanTrip, c: cleanColor, m: logText, t: exitTimeMillis };
    pendingMsgs.set(tempId, tempObj);
    displayedMsgIds.add(tempId);

    const tempEl = cMsg(tempObj, true);
    insertMessageInOrder(tempEl);
    
    isAutoScroll = true;
    unreadMsgIds.clear();
    updateUnreadBadge();

    isJoined = false;
    stopAutoExitTimer();
    safeLS.remove("nz_is_joined");
    safeLS.remove("nz_last_post_time");
    removeFirebaseListeners(); // 通信リスナーの解除
    renderPresence(currentPresenceMap);
    switchUIMode("guest");

    if (D.mi) D.mi.blur();

    requestAnimationFrame(() => {
      scBottom(true);
    });

    db.goOnline();

    if (cleanUid) await db.ref(`presence/official/${myUid}`).remove().catch(()=>{});
    
    if (isAuto) {
      showToast("⏱️ 30分間発言がなかったため、自動退室しました。"); 
    } else {
      showToast("🚪 退室しました。");
    }

    await db.ref(`chat/official`).push({ 
      u: cleanUid || "sys_exit", 
      pnd: tempId, 
      n: cleanName, 
      p: cleanTrip, 
      c: curColor, 
      m: logText, 
      t: exitTimeMillis 
    }).catch(()=>{});
  }

  function triggerOtherExit(targetId, targetUser, calculatedTimeoutTime) {
    if (targetUser.exiting || !db) return;
    targetUser.exiting = true;
    
    db.ref(`presence/official/${targetId}`).transaction(currentData => {
      if (currentData === null) return currentData;
      if (currentData.exiting) return; 
      
      currentData.exiting = true;
      return currentData;
    }, (err, committed, snap) => {
      if (err) { targetUser.exiting = false; return; }
      
      if (committed && snap.exists()) {
        const u = snap.val(), display = (u.n || "").trim();
        if (!display) { db.ref(`presence/official/${targetId}`).remove().catch(()=>{}); return; }
        
        // 【お掃除ログの文面とアイコンの視認性向上】
        const encLog = "[SYS]::📢 [システムお知らせ] " + `${display} ${u.p || ""}`.trim() + " が自動退室しました（30分間発言がなかったため）";
        
        db.ref(`presence/official/${targetId}`).remove().then(() => {
          db.ref(`chat/official`).push({ 
            u: targetId, 
            n: display, 
            p: u.p || "", 
            c: u.c || "#94a3b8", 
            m: encLog, 
            t: calculatedTimeoutTime 
          }).catch(()=>{});
        }).catch(() => {
          targetUser.exiting = false;
        });
      } else {
        targetUser.exiting = false;
      }
    });
  }

  function showLocalSystemMessage(text) {
    const tempId = "err_sys_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6);
    const tempObj = { id: tempId, u: "system", n: "システムエラー", p: "", c: "#f43f5e", m: "[SYS]::" + text, t: getTrueTime() };
    if (!displayedMsgIds.has(tempId)) {
      displayedMsgIds.add(tempId);
      const tempEl = cMsg(tempObj, false);
      insertMessageInOrder(tempEl);
      scBottom(true);
    }
  }

  // 平文による高速な事前承認チェック
  function checkIsTripApproved(tripStr) {
    if (!tripStr || !roomSettings.approvedTrips) return false;
    return Object.values(roomSettings.approvedTrips).includes(tripStr);
  }

  async function joinRoom(isReconnect = false) {
    if (!D.ni || !D.tripi) return;
    if (!db) {
      if (!isReconnect) {
        alert("Firebaseデータベースへの接続が確立されていません。");
      }
      return;
    }

    let n = isReconnect ? (safeLS.get("nz_ni") || "") : D.ni.value;
    n = n.trim();
    if (!n) { if (!isReconnect) alert("名前を入力してください。"); return; }
    const tk = isReconnect ? (safeLS.get("nz_tripi") || "") : D.tripi.value.trim();
    
    myName = n; 
    myTrip = await window.makeTrip(n, tk);

    // BANされていないかチェック
    let isBanned = false;
    await db.ref(`banlist/${myUid}`).once("value").then(s => {
      if (s.val() === true) isBanned = true;
    });
    if (isBanned) {
      alert("管理者によりアクセスが制限されているため、入室できません。");
      return;
    }

    const hasApprovedTrip = checkIsTripApproved(myTrip);

    // 新規入室停止中の割り込み拒否（承認トリップ保有者のみパス）
    if (!isReconnect && roomSettings.newEntriesDisabled && !hasApprovedTrip && myUid !== ADMIN_UID) {
      alert("現在新規入室が制限されています（承認メンバー以外は入室できません）。");
      return;
    }

    // 合言葉（ロック設定）のチェック（承認トリップ保有者は免除）
    if (!isReconnect && roomSettings.passcode && !hasApprovedTrip && myUid !== ADMIN_UID) {
      const userPass = prompt("合言葉（パスコード）を入力してください：");
      if (userPass !== roomSettings.passcode) {
        alert("合言葉が一致しません。入室できませんでした。");
        return;
      }
    }

    isJoined = true;
    safeLS.set("nz_ni", n); 
    safeLS.set("nz_tripi", tk); 
    safeLS.set("nz_is_joined", "true");
    
    const nowTime = getTrueTime();
    updateLastPostTime(nowTime);

    // 入室成功のタイミングで【爆速・遅延ロード】通信リスナーを開始
    queueSetupFirebaseListeners(); 
    switchUIMode("joined");

    const opt = { ...currentPresenceMap };
    opt[myUid || "temp_uid"] = { id: myUid || "temp_uid", n: myName, p: myTrip, c: curColor, t: nowTime };
    renderPresence(opt);

    db.ref(`presence/official/${myUid}`).set({
      n: myName,
      p: myTrip,
      c: curColor,
      t: firebase.database.ServerValue.TIMESTAMP
    }).catch(err => {
      console.warn("Presence registration failed:", err);
      if (err.message && err.message.includes("permission_denied")) {
        showLocalSystemMessage("【セキュリティエラー】入室情報の登録に失敗しました。");
      }
    });

    startAutoExitChecker(); 

    const cleanName = (myName || "").trim();
    if (!isReconnect && cleanName) {
      const enterText = `${cleanName} ${myTrip}`.trim() + " が入室しました", encEnterText = "[SYS]::" + enterText;
      const tempId = "pnd_sys_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6);
      const tempObj = { id: tempId, u: myUid, n: myName, p: myTrip, c: curColor, m: encEnterText, t: nowTime };
      pendingMsgs.set(tempId, tempObj);
      displayedMsgIds.add(tempId);
      const tempEl = cMsg(tempObj, true);
      insertMessageInOrder(tempEl);
      isAutoScroll = true;
      scBottom(true);
      await db.ref(`chat/official`).push({ u: myUid, pnd: tempId, n: myName, p: myTrip, c: curColor, m: encEnterText, t: firebase.database.ServerValue.TIMESTAMP }).catch((err) => {
        const local = renderedMwNodes.get(tempId); if (local) local.remove();
        renderedMwNodes.delete(tempId); pendingMsgs.delete(tempId); displayedMsgIds.delete(tempId);
        if (err.message && err.message.includes("permission_denied")) {
          showLocalSystemMessage("【セキュリティエラー】入室時ログの送信が拒否されました。");
        }
      });
    }
    scBottom(true);
  }

  const pendingMsgs = new Map();

  function syncMessagesDOM(targetMsgs) {
    if (!D.tli || !targetMsgs || !Array.isArray(targetMsgs)) return;
    
    let clean = targetMsgs.filter(m => m && m.id);
    if (clean.length > maxLimit) {
      clean = clean.slice(-maxLimit);
    }

    clean.forEach(m => {
      if (m.pnd && pendingMsgs.has(m.pnd)) {
        pendingMsgs.delete(m.pnd);
        const node = renderedMwNodes.get(m.pnd);
        if (node) {
          node.remove();
          renderedMwNodes.delete(m.pnd);
          displayedMsgIds.delete(m.pnd);
        }
      }
    });

    const allMsgs = [...clean];
    pendingMsgs.forEach((pMsg) => {
      if (!allMsgs.some(m => m.id === pMsg.id || (pMsg.pnd && m.pnd === pMsg.pnd))) {
        allMsgs.push(pMsg);
      }
    });

    allMsgs.sort((a, b) => getMsgTime(a) - getMsgTime(b));

    const targetIds = new Set(allMsgs.map(m => m.id || m.pnd));
    const currentNodes = Array.from(D.tli.children);

    currentNodes.forEach(n => {
      const mid = n.dataset.mid;
      if (mid && !targetIds.has(mid)) {
        n.remove();
        renderedMwNodes.delete(mid);
        displayedMsgIds.delete(mid);
        unreadMsgIds.delete(mid);
      }
    });

    allMsgs.forEach(m => {
      const uniqueId = m.id || m.pnd;
      let el = renderedMwNodes.get(uniqueId);
      
      if (el) {
        updateExistingMsgNode(m, el);
      } else {
        el = cMsg(m, !isFirstLoad);
        renderedMwNodes.set(uniqueId, el);
        displayedMsgIds.add(uniqueId);
        insertMessageInOrder(el);
      }
      
      el.style.opacity = (m.pnd && !m.id) ? "0.6" : "1";

      const msgTime = getMsgTime(m);
      if (!isFirstLoad && m.u !== myUid) {
        if (msgTime > latestDisplayedTs) {
          if (!isAutoScroll || document.visibilityState === "hidden") {
            unreadMsgIds.add(uniqueId);
          }
        }
      }
      if (msgTime > latestDisplayedTs) {
        latestDisplayedTs = msgTime;
      }
    });

    if (isFirstLoad) {
      if (D.tl) D.tl.scrollTop = D.tl.scrollHeight;
      isFirstLoad = false;
    }

    updateUnreadBadge();
    scBottom();
    updateJumpBtns();
  }

  function updateExistingMsgNode(m, el) {
    const isSys = m.sys === true || (typeof m.m === "string" && m.m.startsWith("[SYS]::"));
    const col = m.c || "#94a3b8";
    const isCurrentlySys = el.querySelector(".sys-msg") !== null;

    if (isSys !== isCurrentlySys || el.dataset.rawMsg !== m.m || el.dataset.uid !== (m.u || "") || el.style.color !== col) {
      const newEl = cMsg(m, false);
      el.replaceWith(newEl);
      renderedMwNodes.set(m.id || m.pnd, newEl);
    }
  }

  const deleteMessage = (msgId) => {
    if (!db || !msgId) return;

    if (pendingMsgs.has(msgId)) {
      pendingMsgs.delete(msgId);
      const node = renderedMwNodes.get(msgId);
      if (node) node.remove();
      renderedMwNodes.delete(msgId);
      displayedMsgIds.delete(msgId);
      syncMessagesDOM(lastMsgsCache);
      return;
    }

    db.ref(`chat/official/${msgId}`).remove()
      .then(() => {
        showToast("メッセージを削除しました。");
      })
      .catch((err) => {
        console.error("メッセージの削除に失敗しました:", err);
        showToast("削除に失敗しました。");
      });
  };

  function cMsg(m, isNewIncoming = false) {
    const el = document.createElement("div");
    el.className = "mw" + (isNewIncoming ? " new-msg-anim" : "");
    el.dataset.mid = m.id || m.pnd;
    const msgTime = getMsgTime(m);
    el.dataset.ts = msgTime;
    el.dataset.rawMsg = m.m;
    el.dataset.uid = m.u || "";

    if (isNewIncoming) {
      el.addEventListener("animationend", () => {
        el.classList.remove("new-msg-anim");
      }, { once: true });
    }

    const isSys = m.sys === true || (typeof m.m === "string" && m.m.startsWith("[SYS]::"));
    if (isSys) {
      let display = m.m.startsWith("[SYS]::") ? m.m.substring(7) : m.m;
      el.innerHTML = `<div class="sys-msg">${escapeHtml(display)}<span class="sys-ts">[${fDT(msgTime)}]</span></div>`;
      renderedMwNodes.set(m.id || m.pnd, el);
      return el;
    }

    const name = m.n || "名無し", trip = m.p || "", color = m.c || "#94a3b8";
    
    // 【管理者UIDであれば全てのメッセージに「削除」ボタンを表示します】
    const isDeletable = (m.u === myUid && m.u !== "") || (myUid === ADMIN_UID);
    const delBtnHtml = isDeletable ? `<button class="msg-del-btn" data-del-id="${m.id || m.pnd}">削除</button>` : "";

    // 【UIDの公のUI表示を完全廃止（内部データ上は保持し、BANや削除機能のみで使用）】
    el.innerHTML = `
      <div class="mm" style="color: ${color}">
        <span class="mm-name">${escapeHtml(name)}</span>
        <span class="mm-trip" style="display: ${trip ? 'inline' : 'none'}">${escapeHtml(trip)}</span>
        <span class="ts">${fDT(msgTime)}</span>
      </div>
      <div class="mb" style="border-left: 2px solid ${color}; padding-left: 8px;"></div>
      ${delBtnHtml}
    `;

    const mb = el.querySelector(".mb");

    if (m.m) {
      parseTxtSplit(m.m).forEach(node => mb.appendChild(node));
      if (m.m.includes("http")) {
        const urls = m.m.match(UR);
        if (urls) urls.forEach(u => {
          const media = createMediaContainer(u);
          if (media) mb.appendChild(media);
        });
      }
    }

    if (isDeletable) {
      const delBtn = el.querySelector(".msg-del-btn");
      if (delBtn) {
        delBtn.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          e.stopPropagation();
          const targetId = delBtn.dataset.delId;
          if (confirm("このメッセージを削除しますか？")) {
            deleteMessage(targetId);
          }
        });
      }
    }

    renderedMwNodes.set(m.id || m.pnd, el);
    return el;
  }

  const getAudioFileName = (url) => {
    try {
      const u = new URL(url);
      const path = u.pathname;
      const file = path.substring(path.lastIndexOf('/') + 1);
      return decodeURIComponent(file) || "audio_file";
    } catch(e) {
      return "audio_file";
    }
  };

  const fetchAudioSize = (url, sizeSpan) => {
    if (!sizeSpan) return;
    sizeSpan.textContent = "容量: 取得中...";
    fetch(url, { method: "HEAD" })
      .then(res => {
        if (res.ok) {
          const len = res.headers.get("Content-Length");
          if (len) {
            const bytes = parseInt(len, 10);
            const mb = (bytes / (1024 * 1024)).toFixed(2);
            sizeSpan.textContent = `容量: ${mb} MB`;
            return;
          }
        }
        sizeSpan.textContent = "容量: 不明";
      })
      .catch(() => {
        sizeSpan.textContent = "容量: 不明";
      });
  };

  function getYoutubeId(url) {
    if (!url) return null;
    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|shorts\/)([^#\&\?]*).*/;
    const match = url.match(regExp);
    return (match && match[2].length === 11) ? match[2] : null;
  }

  function getNicoId(url) {
    if (!url) return null;
    const match = url.match(/(sm\d+|so\d+|nm\d+|1\d+)/);
    return match ? match[0] : null;
  }

  function createMediaContainer(url) {
    // クエリパラメータやハッシュ記号を取り除いたクリーンなURLパスで拡張子判定を行います（爆速マッチ対応）
    const cleanUrl = url.split(/[?#]/)[0];
    
    const ytId = getYoutubeId(url), nicoId = getNicoId(url);
    const isImg = /\.(jpe?g|png|gif|webp|svg|bmp)$/i.test(cleanUrl);
    const isAudio = /\.(mp3|wav|ogg|m4a|flac)$/i.test(cleanUrl);

    if (!ytId && !nicoId && !isImg && !isAudio) return null;

    const container = document.createElement("div");
    container.className = "media-link-container";
    const row = document.createElement("div");
    row.className = "media-inline-row";

    const badge = document.createElement("span");
    badge.className = "media-badge";

    if (isImg) {
      const img = document.createElement("img");
      img.className = "inline-img";
      img.src = url;
      img.decoding = "async";
      img.loading = "lazy";
      img.onload = () => scBottomOnImgLoad();
      img.onclick = () => {
        if (D.imgViewSrc && D.imgViewMod) {
          D.imgViewSrc.src = url;
          resetZoom();
          D.imgViewMod.classList.add("show");
        }
      };
      container.appendChild(img);
      return container;
    }

    const playBtn = document.createElement("button");
    playBtn.className = "open-player-btn";
    playBtn.textContent = "▶ プレイヤーで再生";

    if (ytId) {
      badge.textContent = "YouTube";
      badge.style.background = "#ef4444";
      playBtn.onclick = (e) => { e.preventDefault(); openFloatingPlayer(url, "youtube"); };
    } else if (nicoId) {
      badge.textContent = "ニコニコ";
      badge.style.background = "#2563eb";
      playBtn.onclick = (e) => { e.preventDefault(); openFloatingPlayer(url, "niconico"); };
    } else if (isAudio) {
      badge.textContent = "AUDIO";
      badge.style.background = "#10b981";
      playBtn.onclick = (e) => { e.preventDefault(); openFloatingPlayer(url, "audio"); };
    }

    row.appendChild(badge);
    row.appendChild(playBtn);
    container.appendChild(row);
    return container;
  }

  const closePlayer = () => {
    if (!D.fixedPlayer || !D.playerContent) return;
    
    const ae = D.playerContent.querySelector("audio");
    if (ae) {
      ae.pause();
      ae.src = "";
    }
    
    D.fixedPlayer.style.display = "none";
    D.playerContent.innerHTML = "";
    updateJumpBtns();
  };

  function openFloatingPlayer(url, type) {
    if (!D.fixedPlayer || !D.playerContent) return;
    
    const prevAe = D.playerContent.querySelector("audio");
    if (prevAe) {
      prevAe.pause();
      prevAe.src = "";
    }

    D.fixedPlayer.style.display = "flex";
    
    const titleEl = $("playerTitle");
    D.playerContent.innerHTML = "";
    D.playerContent.style.aspectRatio = "";
    D.playerContent.style.height = "";
    D.playerContent.style.width = "";

    if (type === "audio") {
      if (titleEl) titleEl.textContent = "🎵 インライン音楽プレイヤー";
      D.playerContent.style.height = "auto";
      D.playerContent.style.background = "var(--s2)";

      const name = getAudioFileName(url);
      const playerHtml = `
        <div class="audio-player-container" style="padding: 16px; width: 100%; display: flex; flex-direction: column; gap: 8px; background: var(--s2);">
          <div style="font-size: 13px; font-weight: bold; word-break: break-all; color: var(--tx);" id="audioFileName"></div>
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px;">
            <span style="font-size: 11px; color: var(--mu);" id="audioFileSize">容量: 取得中...</span>
            <a id="audioDownloadBtn" class="btn" style="background: var(--in); color: #fff; height: 30px; padding: 0 12px; font-size: 12px; border-radius: 6px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;" href="" target="_blank" download>
              📥 ダウンロード
            </a>
          </div>
          <audio id="audioElement" controls style="width: 100%; height: 40px; margin-top: 4px; outline: none;"></audio>
        </div>
      `;
      D.playerContent.innerHTML = playerHtml;
      
      const fn = $("audioFileName");
      if (fn) fn.textContent = name;
      const dl = $("audioDownloadBtn");
      if (dl) {
        dl.href = url;
        dl.download = name;
      }
      const ae = $("audioElement");
      if (ae) {
        ae.src = url;
        ae.play().catch(()=>{});
      }
      const sz = $("audioFileSize");
      fetchAudioSize(url, sz);

    } else {
      const ytId = getYoutubeId(url);
      const nicoId = getNicoId(url);

      if (type === "youtube" && ytId) {
        const isShorts = url.includes("/shorts/");
        if (isShorts) {
          if (titleEl) titleEl.textContent = "📱 YouTube Shorts 再生";
          if (window.innerWidth <= 580) {
            D.playerContent.style.height = "280px";
            D.playerContent.style.width = "157px";
          } else {
            D.playerContent.style.height = "380px";
            D.playerContent.style.width = "214px";
          }
        } else {
          if (titleEl) titleEl.textContent = "📺 YouTube 再生";
          if (window.innerWidth <= 580) {
            D.playerContent.style.height = "180px";
            D.playerContent.style.width = "320px";
          } else {
            D.playerContent.style.aspectRatio = "16/9";
          }
        }

        const thumbUrl = `https://i.ytimg.com/vi/${ytId}/hqdefault.jpg`;
        D.playerContent.innerHTML = `
          <div id="playerFacade" style="position:relative; width:100%; height:100%; background:#000; cursor:pointer; display:flex; align-items:center; justify-content:center;">
            <img src="${thumbUrl}" style="width:100%; height:100%; object-fit:cover; opacity:0.65;" alt="動画サムネイル">
            <div style="position:absolute; width:68px; height:48px; background:rgba(0,0,0,0.85); border-radius:12px; display:flex; align-items:center; justify-content:center; border:2px solid #fff;">
              <div style="width:0; height:0; border-style:solid; border-width:10px 0 10px 18px; border-color:transparent transparent transparent #fff; margin-left:4px;"></div>
            </div>
            <span style="position:absolute; bottom:10px; font-size:11px; background:rgba(0,0,0,0.8); padding:3px 10px; border-radius:4px; color:#fff; font-weight:bold;">クリックしてロード</span>
          </div>
        `;

        $("playerFacade").onclick = () => {
          let origin = window.location.protocol.startsWith("http") ? `&origin=${encodeURIComponent(window.location.origin)}` : "";
          const iframe = document.createElement("iframe");
          iframe.frameBorder = "0";
          iframe.scrolling = "no";
          iframe.allow = "autoplay; encrypted-media; picture-in-picture";
          iframe.allowFullscreen = true;
          iframe.style.width = "100%";
          iframe.style.height = "100%";
          iframe.src = `https://www.youtube-nocookie.com/embed/${ytId}?autoplay=0&controls=1&rel=0&playsinline=1&modestbranding=1${origin}`;
          
          D.playerContent.innerHTML = "";
          D.playerContent.appendChild(iframe);
        };

      } else if (type === "niconico" && nicoId) {
        if (titleEl) titleEl.textContent = "📺 ニコニコ動画 再生";
        if (window.innerWidth <= 580) {
          D.playerContent.style.height = "180px";
          D.playerContent.style.width = "320px";
        } else {
          D.playerContent.style.aspectRatio = "16/9";
        }

        D.playerContent.innerHTML = `
          <div id="playerFacade" style="position:relative; width:100%; height:100%; background:#131722; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px;">
            <div style="width:68px; height:48px; background:rgba(37,99,235,0.9); border-radius:12px; display:flex; align-items:center; justify-content:center; border:2px solid #fff;">
              <div style="width:0; height:0; border-style:solid; border-width:10px 0 10px 18px; border-color:transparent transparent transparent #fff; margin-left:4px;"></div>
            </div>
            <span style="font-size:11.5px; font-weight:bold; color:var(--mu);">クリックしてニコニコ動画をロード</span>
          </div>
        `;

        $("playerFacade").onclick = () => {
          const iframe = document.createElement("iframe");
          iframe.frameBorder = "0";
          iframe.scrolling = "no";
          iframe.allow = "autoplay; encrypted-media; picture-in-picture";
          iframe.allowFullscreen = true;
          iframe.style.width = "100%";
          iframe.style.height = "100%";
          iframe.src = `https://embed.nicovideo.jp/watch/${nicoId}?jsapi=0&autoplay=0`;
          
          D.playerContent.innerHTML = "";
          D.playerContent.appendChild(iframe);
        };
      }
    }

    scBottom();
    updateJumpBtns();
  }

  function renderPresence(serverListMap) {
    if (!isPresenceInitialized) return; 
    const clean = { ...serverListMap };
    if (isJoined && myUid) {
      if (!clean[myUid]) clean[myUid] = { id: myUid, n: myName, p: myTrip, c: curColor, t: getTrueTime() };
    } else if (!isJoined && myUid) delete clean[myUid];
    populatePresenceList(Object.values(clean).filter(m => m && m.n));
  }

  function populatePresenceList(membersList) {
    if (!D.pl) return;
    const sorted = [...membersList].filter(m => m.n && m.n.trim() !== "").sort((a, b) => a.id.localeCompare(b.id));

    const targetIds = new Set(sorted.map(m => m.id));
    const currentChips = Array.from(D.pl.children);

    currentChips.forEach(chip => {
      const uid = chip.dataset.uid;
      if (uid && !targetIds.has(uid)) {
        chip.remove();
      }
    });

    sorted.forEach(m => {
      const text = m.p ? `${m.n} ${m.p}` : m.n;
      const color = m.c || "#94a3b8";
      let chip = D.pl.querySelector(`[data-uid="${m.id}"]`);
      
      if (chip) {
        if (chip.textContent !== text) chip.textContent = text;
        if (chip.style.color !== color) {
          chip.style.color = color;
          chip.style.borderColor = color + "44";
        }
      } else {
        chip = document.createElement("span");
        chip.className = "chip";
        chip.dataset.uid = m.id;
        chip.style.color = color;
        chip.style.borderColor = color + "44";
        chip.textContent = text;
        
        // 【管理者はオンラインユーザー一覧をクリックしてBAN（追い出し）を実行できます】
        if (myUid === ADMIN_UID && m.id !== ADMIN_UID) {
          chip.title = "クリックしてこのユーザーをBAN（追放）する";
          chip.style.cursor = "pointer";
          chip.addEventListener("click", () => {
            if (confirm(`ユーザー「${m.n}」をBANしますか？\n(二度と再入室できなくなります)`)) {
              banUser(m.id);
            }
          });
        }
        
        D.pl.appendChild(chip);
      }
    });

    if (D.pcnt) {
      D.pcnt.textContent = `${sorted.length}人`;
      D.pcnt.style.display = "inline-block"; 
    }
    updateJumpBtns();
  }

  // 管理者によるユーザーBAN機能
  function banUser(targetUid) {
    if (!db || myUid !== ADMIN_UID) return;
    db.ref(`banlist/${targetUid}`).set(true)
      .then(() => {
        showToast("ユーザーをBANしました。");
        // オンラインから削除
        db.ref(`presence/official/${targetUid}`).remove().catch(()=>{});
      })
      .catch((err) => {
        console.error("BANに失敗しました:", err);
      });
  }

  async function forceSync() {
    if (!db) return;
    db.goOnline();
  }

  let setupListenersTimer = null;
  function queueSetupFirebaseListeners() {
    if (setupListenersTimer) clearTimeout(setupListenersTimer);
    setupListenersTimer = setTimeout(() => {
      setupFirebaseListeners();
    }, 150);
  }

  let chatQuery = null;
  let presenceRef = null;

  // 【爆速遅延ロード：入室するまで過去ログやオンラインリストのデータ送受信を物理的に遮断します】
  function setupFirebaseListeners() {
    if (!db) return;
    if (isFirebaseListenersBound) return; // 二重接続の防止
    isFirebaseListenersBound = true;

    const chatRef = db.ref(`chat/official`);
    presenceRef = db.ref(`presence/official`);
    chatRef.off(); 
    presenceRef.off();

    chatQuery = chatRef.orderByKey().limitToLast(currentLimit); 

    chatQuery.on("value", snap => {
      const msgs = [];
      snap.forEach(child => {
        const m = child.val();
        if (m) {
          m.id = child.key;
          msgs.push(m);
        }
      });
      lastMsgsCache = msgs; 
      syncMessagesDOM(msgs);
      isFirstLoad = false;
    }, err => {
      console.warn("Firebase query listener error:", err);
    });

    presenceRef.on("value", s => {
      const list = s.val();
      
      if (!list || Object.keys(list).length === 0) {
        if (isOffsetLoaded && isConnectedBound) {
          return; 
        }
      }

      const listObj = list || {}, members = {}, nowTrue = getTrueTime();
      for (const [id, u] of Object.entries(listObj)) {
        if (u && u.n) {
          let ut = (u.t && typeof u.t === "object") ? nowTrue : u.t;
          if (!ut || typeof ut !== "number") continue;
          
          if (isOffsetLoaded && id !== myUid && (nowTrue - ut >= 1800000)) { 
            triggerOtherExit(id, u, ut + 1800000); 
            continue; 
          }
          members[id] = { id, ...u, t: ut };
        }
      }
      currentPresenceMap = members;
      isPresenceInitialized = true; 
      renderPresence(members);
    }, err => {
      console.warn("Firebase presence listener error:", err);
    });
  }

  // 通信リスナーを完全に破棄して遅延状態（未入室）に戻す
  function removeFirebaseListeners() {
    if (chatQuery) chatQuery.off();
    if (presenceRef) presenceRef.off();
    isFirebaseListenersBound = false;
  }

  // グローバルなルーム設定情報のリアルタイム取得
  function initSettingsListener() {
    if (!db) return;
    db.ref("settings").on("value", snap => {
      const val = snap.val() || {};
      roomSettings.isPrivate = val.isPrivate || false;
      roomSettings.newEntriesDisabled = val.newEntriesDisabled || false;
      roomSettings.passcode = val.passcode || "";
      roomSettings.approvedTrips = val.approvedTrips || {};
      
      applyPrivateModeUI();
      if (myUid === ADMIN_UID) {
        updateAdminModalFields();
      }
    });
  }

  const initDirectDatabaseProcess = async () => {
    await syncProfileValues();

    if (typeof firebase !== 'undefined' && firebase.auth) {
      firebase.auth().onAuthStateChanged(async (user) => {
        if (user) {
          const oldUid = myUid;
          myUid = user.uid;
          safeLS.set("nz_permanent_uid", myUid);
          
          if (oldUid !== myUid && lastMsgsCache.length > 0) {
            syncMessagesDOM(lastMsgsCache);
          }
          
          // 自分がBANリストに入っていないか監視
          db.ref(`banlist/${myUid}`).on("value", s => {
            if (s.val() === true && isJoined) {
              alert("管理者によりアクセスが制限（BAN）されました。");
              doExit();
            }
          });

          // 管理者ログイン時のUI変化
          if (myUid === ADMIN_UID) {
            $("admBtn").style.display = "inline-flex";
          } else {
            $("admBtn").style.display = "none";
          }
          
          if (isJoined && db) {
            db.ref(`presence/official/${myUid}`).set({
              n: myName,
              p: myTrip,
              c: curColor,
              t: firebase.database.ServerValue.TIMESTAMP
            }).catch(()=>{});
          }
          switchUIMode(isJoined ? "joined" : "guest");
          
          // 常時監視が必要なルーム設定リスナーを初期化
          initSettingsListener();

          // 入室済みの場合は通信データを開始、未入室なら開始せずロードを最速化
          if (isJoined) {
            queueSetupFirebaseListeners();
          } else {
            removeFirebaseListeners();
          }
        } else {
          firebase.auth().signInAnonymously().catch(err => {
            console.error("Anonymous auth sign-in failed:", err);
          });
        }
      });
    }

    forceSync();

    const lastPost = parseInt(safeLS.get("nz_last_post_time") || "0");
    const nowTrue = getTrueTime();
    if (isJoined && lastPost && (nowTrue - lastPost >= 30 * 60 * 1000)) {
      isJoined = false;
      safeLS.remove("nz_is_joined");
      safeLS.remove("nz_last_post_time");
      if (db && myUid) {
        db.ref(`presence/official/${myUid}`).remove().catch(()=>{});
      }
    }

    if (db) {
      if (isJoined) {
        joinRoom(true); 
        
        const elapsed = nowTrue - lastPost;
        const remaining = Math.max(1000, (30 * 60 * 1000) - elapsed);
        stopAutoExitTimer();
        autoExitTimeoutId = setTimeout(() => { doExit(true); }, remaining);
      }
    }

    switchUIMode(isJoined ? "joined" : "guest");

    if (!isConnectedBound && db) {
      try {
        db.ref(".info/serverTimeOffset").on("value", snap => { 
          serverTimeOffset = snap.val() || 0; 
          isOffsetLoaded = true;
          
          const refreshedNowTrue = getTrueTime();
          const refreshedLastPost = parseInt(safeLS.get("nz_last_post_time") || "0");
          if (isJoined && refreshedLastPost && (refreshedNowTrue - refreshedLastPost >= 30 * 60 * 1000)) {
            doExit(true);
          }
        });
        db.ref(".info/connected").on("value", snap => {
          if (snap.val() === true) {
            if (isJoined) {
              queueSetupFirebaseListeners();
            }

            if (isJoined && myUid && myName.trim()) {
              db.ref(`presence/official/${myUid}`).set({
                n: myName,
                p: myTrip,
                c: curColor,
                t: firebase.database.ServerValue.TIMESTAMP
              }).catch(()=>{});
            }
          }
        });
        isConnectedBound = true;
      } catch (e) { console.warn("Fail serverTimeOffset", e); }
    }
  };

  function insertMessageInOrder(newEl) {
    if (!D.tli || !newEl) return;
    const newTs = parseInt(newEl.dataset.ts, 10);
    const children = Array.from(D.tli.children);
    
    let inserted = false;
    for (let i = children.length - 1; i >= 0; i--) {
      const childTs = parseInt(children[i].dataset.ts, 10);
      if (newTs >= childTs) {
        children[i].after(newEl);
        inserted = true;
        break;
      }
    }
    if (!inserted) {
      D.tli.prepend(newEl);
    }
  }

  function scBottom(force = false) {
    if (!D.tl) return;
    if (isAutoScroll || force) {
      _scPending = true;
      requestAnimationFrame(() => {
        D.tl.scrollTop = D.tl.scrollHeight;
        _scPending = false;
      });
    }
  }

  function scBottomOnImgLoad() {
    if (isAutoScroll) {
      scBottom(true);
    }
  }

  function buildPicker(container, selectedColor, btnClass, onSelect) {
    if (!container) return;
    container.innerHTML = "";
    COLORS.forEach(c => {
      const btn = document.createElement("button");
      btn.className = btnClass;
      btn.style.backgroundColor = c.v;
      btn.dataset.color = c.v;
      btn.title = c.n;
      if (c.v === selectedColor) {
        btn.classList.add("sel");
      }
      btn.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        onSelect(c.v);
      });
      container.appendChild(btn);
    });
  }

  function parseTxtSplit(text) {
    if (typeof text !== "string") return [];
    const parts = text.split(UR);
    const nodes = [];
    parts.forEach((part) => {
      if (part.match(UR)) {
        const a = document.createElement("a");
        a.href = part;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = part;
        a.style.color = "#38bdf8";
        a.style.textDecoration = "underline";
        nodes.push(a);
      } else if (part) {
        nodes.push(document.createTextNode(part));
      }
    });
    return nodes;
  }

  function updateUnreadBadge() {
    if (!D.unreadBadge) return;
    const count = unreadMsgIds.size;
    if (count > 0) {
      D.unreadBadge.textContent = count > 99 ? "99+" : count;
      D.unreadBadge.style.display = "inline-flex";
    } else {
      D.unreadBadge.style.display = "none";
    }
  }

  function updateJumpBtns() {
    if (!D.tl) return;
    const scrollTop = D.tl.scrollTop;
    const scrollHeight = D.tl.scrollHeight;
    const clientHeight = D.tl.clientHeight;

    if (D.jumpUpBtn) {
      D.jumpUpBtn.disabled = (scrollTop <= 5);
    }
    if (D.jumpDownBtn) {
      D.jumpDownBtn.disabled = (scrollTop + clientHeight >= scrollHeight - 10);
    }
  }

  async function sendMsg() {
    if (!isJoined || !db || !D.mi) return;
    const val = D.mi.value;
    if (!val || !val.trim()) return;

    const now = Date.now();
    if (now - lastSendTime < 1000) {
      showToast("送信が早すぎます。1秒以上あけてください。");
      return;
    }
    lastSendTime = now;

    const rawMsg = val;
    D.mi.value = "";
    D.mi.style.height = "auto";
    D.mi.dispatchEvent(new Event("input"));
    updateClrMsgBtnVisibility();

    const timestampNow = getTrueTime();
    updateLastPostTime(timestampNow);
    startAutoExitChecker(); 

    if (myUid) {
      db.ref(`presence/official/${myUid}`).update({
        t: firebase.database.ServerValue.TIMESTAMP 
      }).catch(()=>{});
    }

    const tempId = "pnd_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6);
    const tempObj = {
      pnd: tempId, 
      u: myUid,
      n: myName,
      p: myTrip,
      c: curColor,
      m: rawMsg,
      t: timestampNow
    };

    pendingMsgs.set(tempId, tempObj);
    syncMessagesDOM(lastMsgsCache);

    db.ref("chat/official").push({
      pnd: tempId, 
      u: myUid,
      n: myName,
      p: myTrip,
      c: curColor,
      m: rawMsg,
      t: firebase.database.ServerValue.TIMESTAMP
    }).then(() => {
      if (pendingMsgs.has(tempId)) {
        pendingMsgs.delete(tempId);
        const node = renderedMwNodes.get(tempId);
        if (node) node.remove();
        renderedMwNodes.delete(tempId);
      }
    }).catch(err => {
      pendingMsgs.delete(tempId);
      const node = renderedMwNodes.get(tempId);
      if (node) node.remove();
      renderedMwNodes.delete(tempId);
      showToast("メッセージの送信に失敗しました。");
      console.error(err);
    });

    if (keepKbOpen) {
      D.mi.focus();
    } else {
      D.mi.blur();
    }
    isAutoScroll = true;
    scBottom(true);
  }

  // 管理画面用のデータ同期表示
  function updateAdminModalFields() {
    $("admPrivate").checked = roomSettings.isPrivate;
    $("admStopJoin").checked = roomSettings.newEntriesDisabled;
    $("admPass").value = roomSettings.passcode;
    
    // 承認リストのUIレンダリング（O(N) 爆速描画）
    const container = $("admTripList");
    container.innerHTML = "";
    const list = roomSettings.approvedTrips || {};
    Object.entries(list).forEach(([key, val]) => {
      const div = document.createElement("div");
      div.style.display = "flex";
      div.style.justify = "space-between";
      div.style.alignItems = "center";
      div.style.padding = "2px 4px";
      div.style.background = "rgba(255,255,255,0.03)";
      div.style.borderRadius = "4px";
      
      div.innerHTML = `
        <span>${escapeHtml(val)}</span>
        <button class="bclrm show" style="position:static; width:18px; height:18px; font-size:11px; opacity:0.8; pointer-events:auto;" title="削除">×</button>
      `;
      div.querySelector("button").onclick = () => {
        if (confirm(`このトリップ「${val}」を事前承認リストから削除しますか？`)) {
          db.ref(`settings/approvedTrips/${key}`).remove();
        }
      };
      container.appendChild(div);
    });
    if (Object.keys(list).length === 0) {
      container.innerHTML = `<span style="color:var(--mu); font-style:italic;">承認済みトリップはありません</span>`;
    }
  }

  function initApp() {
    D = {
      ni: $("ni"),
      tripi: $("tripi"),
      tripPrevText: $("tripPrevText"),
      copyTripBtn: $("copyTripBtn"),
      joinBtn: $("joinBtn"),
      sdBtn: $("sdBtn"),
      ib: $("ib"),
      joinForm: $("joinForm"),
      exBtn: $("exBtn"),
      clrBtn: $("clrBtn"),
      fixedPlayer: $("fixedPlayer"),
      playerCloseBtn: $("playerCloseBtn"),
      playerContent: $("playerContent"),
      tl: $("tl"),
      tli: $("tl-inner"),
      unreadBadge: $("unreadBadge"),
      jumpUpBtn: $("jumpUpBtn"),
      jumpDownBtn: $("jumpDownBtn"),
      clrMsgBtn: $("clrMsgBtn"),
      clrmod: $("clrmod"),
      imgViewMod: $("imgViewMod"),
      imgViewSrc: $("imgViewSrc"),
      imgViewCloseBtn: $("imgViewCloseBtn"),
      clrCancel: $("clrCancel"),
      clrOk: $("clrOk"),
      clrPick2: $("clrPick2"),
      clrPrev: $("clrPrev"),
      pcnt: $("pcnt"),
      pl: $("pl"),
      mi: $("mi"),
      kbKeepOpenChk: $("kbKeepOpenChk"),
      clrDot: $("clrDot")
    };

    if (D.tl) {
      let isScrolling = false;
      D.tl.addEventListener("scroll", () => {
        if (isScrolling) return;
        isScrolling = true;
        requestAnimationFrame(() => {
          const scrollTop = D.tl.scrollTop, clientHeight = D.tl.clientHeight, scrollHeight = D.tl.scrollHeight;
          
          if (!_scPending) {
            if (scrollTop + clientHeight >= scrollHeight - 30) {
              isAutoScroll = true;
              if (unreadMsgIds.size > 0) { 
                unreadMsgIds.clear(); 
                updateUnreadBadge(); 
              }
            } else {
              isAutoScroll = false;
            }
          }
          updateJumpBtns();
          isScrolling = false;
        });
      }, { passive: true });
    }

    if (D.playerCloseBtn) {
      D.playerCloseBtn.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        closePlayer();
      });
    }

    if (D.exBtn) {
      D.exBtn.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        if (isJoined && confirm("退室して参加前の画面に戻りますか？")) {
          doExit();
        }
      });
    }

    if (D.sdBtn) {
      D.sdBtn.addEventListener("pointerdown", (e) => {
        e.preventDefault(); 
        sendMsg();
      });
    }

    if (D.clrBtn) {
      D.clrBtn.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        tmpColor = curColor; updateModalColorPreview(tmpColor);
        buildPicker(D.clrPick2, tmpColor, "clrc2", (v) => {
          tmpColor = v; updateModalColorPreview(v);
          if (D.clrPick2) D.clrPick2.querySelectorAll("button").forEach(b => b.classList.toggle("sel", b.dataset.color === v));
        });
        if (D.clrmod) D.clrmod.classList.add("show");
      });
    }

    if (D.clrCancel) {
      D.clrCancel.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        if (D.clrmod) D.clrmod.classList.remove("show");
      });
    }

    if (D.clrOk) {
      D.clrOk.addEventListener("pointerdown", async (e) => {
        e.preventDefault();
        curColor = tmpColor; setGlobalColor(curColor); safeLS.set("nz_color", curColor);
        if (D.clrmod) D.clrmod.classList.remove("show"); await syncProfileValues();
        if (isJoined && db) {
          db.ref(`presence/official/${myUid}`).update({ c: curColor }).catch(()=>{});
        }
      });
    }

    if (D.clrMsgBtn) {
      D.clrMsgBtn.addEventListener("pointerdown", (e) => {
        e.preventDefault(); 
        if (D.mi) {
          D.mi.value = "";
          D.mi.style.height = "auto";
          D.mi.dispatchEvent(new Event("input"));
          updateClrMsgBtnVisibility();
        }
      });
    }

    if (D.jumpUpBtn) {
      D.jumpUpBtn.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        if (D.tl) {
          D.tl.scrollTo({ top: 0, behavior: "smooth" });
        }
      });
    }
    if (D.jumpDownBtn) {
      D.jumpDownBtn.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        isAutoScroll = true; unreadMsgIds.clear(); updateUnreadBadge(); if (D.tl) D.tl.scrollTo({ top: D.tl.scrollHeight, behavior: "smooth" });
      });
    }

    let isComposing = false;

    if (D.mi) {
      D.mi.addEventListener("compositionstart", () => { isComposing = true; });
      D.mi.addEventListener("compositionend", () => { isComposing = false; });
      D.mi.addEventListener("focus", () => { 
        isAutoScroll = true; 
        unreadMsgIds.clear(); 
        updateUnreadBadge(); 
        scBottom(true); 
        setTimeout(() => { scBottom(true); }, 150);
        setTimeout(() => { scBottom(true); }, 350);
      });
      D.mi.addEventListener("input", () => {
        D.mi.style.height = "auto";
        D.mi.style.height = Math.min(120, D.mi.scrollHeight) + "px";
        scBottom(true);
        updateClrMsgBtnVisibility(); 
      });
      D.mi.addEventListener("keydown", e => {
        if (e.key === "Enter" && !e.shiftKey) {
          if (isComposing) return; 
          e.preventDefault(); 
          sendMsg();
        }
      });
    }

    if (D.ni) {
      D.ni.addEventListener("input", async () => { safeLS.set("nz_ni", D.ni.value); await syncProfileValues(); });
      D.ni.addEventListener("keydown", handleJoinKey);
    }
    if (D.tripi) {
      D.tripi.addEventListener("input", async () => { safeLS.set("nz_tripi", D.tripi.value.trim()); await syncProfileValues(); });
      D.tripi.addEventListener("keydown", handleJoinKey);
    }

    if (D.joinBtn) {
      D.joinBtn.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        joinRoom();
      });
    }
    if (D.copyTripBtn) {
      D.copyTripBtn.addEventListener("pointerdown", async (e) => {
        e.preventDefault();
        const niVal = (D.ni ? D.ni.value.trim() : "") || "名無し", tripiVal = D.tripi ? D.tripi.value.trim() : "";
        if (!tripiVal) return;
        const tLobby = await window.makeTrip(niVal, tripiVal);
        if (tLobby) {
          try {
            await navigator.clipboard.writeText(tLobby);
            const copyBtn = D.copyTripBtn, original = copyBtn.textContent;
            copyBtn.textContent = "コピー完了！"; copyBtn.style.background = "#10b981";
            setTimeout(() => { copyBtn.textContent = original; copyBtn.style.background = ""; }, 1500);
          } catch (err) { alert("コピーに失敗しました。"); }
        }
      });
    }

    if (D.imgViewCloseBtn) {
      D.imgViewCloseBtn.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        if (D.imgViewMod) D.imgViewMod.classList.remove("show");
