<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>UID確認・コピーツール</title>
<!-- Firebase SDK v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<style>
  :root {
    --bg: #090d16;
    --sf: #151c2c;
    --bd: #27314f;
    --tx: #f1f5f9;
    --mu: #94a3b8;
    --in: #4f46e5;
    --em: #10b981;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg);
    color: var(--tx);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    background: var(--sf);
    border: 1px solid var(--bd);
    border-radius: 12px;
    padding: 24px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }
  h1 {
    font-size: 18px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  p {
    font-size: 13px;
    color: var(--mu);
    margin-bottom: 20px;
    line-height: 1.5;
  }
  .warning {
    background: rgba(244, 63, 94, 0.1);
    border: 1px solid rgba(244, 63, 94, 0.2);
    color: #fda4af;
    padding: 10px;
    border-radius: 6px;
    font-size: 12px;
    margin-bottom: 16px;
  }
  .uid-box {
    background: #0d1117;
    border: 1px solid var(--bd);
    border-radius: 8px;
    padding: 14px;
    font-family: monospace;
    font-size: 14px;
    word-break: break-all;
    margin-bottom: 16px;
    user-select: all;
    -webkit-user-select: all;
    min-height: 48px;
    display: flex;
    align-items: center;
  }
  .btn {
    width: 100%;
    padding: 12px;
    background: var(--in);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .btn:hover {
    background: #3b32c0;
  }
  .btn:disabled {
    background: var(--bd);
    color: var(--mu);
    cursor: not-allowed;
  }
  .status {
    font-size: 12px;
    text-align: center;
    margin-top: 12px;
    color: var(--mu);
  }
</style>
</head>
<body>

<div class="card">
  <h1>🔑 UID 確認・コピー</h1>
  <p>現在このブラウザ・ドメインに保存されているUIDを表示しています。チャットで管理者権限を設定する際などに、このUIDをコピーして使用してください。</p>
  
  <div class="warning" id="domainWarning" style="display: none;">
    ⚠️ 注意: チャットアプリと異なるドメインからアクセスされた場合、ここでのUIDとチャットでのUIDは別物になります。
  </div>

  <div class="uid-box" id="uidDisplay">取得中...</div>
  
  <button class="btn" id="copyBtn" disabled>UIDをクリップボードにコピー</button>
  <div class="status" id="statusMessage">情報を読み込んでいます...</div>
</div>

<script>
  // チャットアプリと完全に同じFirebase設定
  const firebaseConfig = {
    apiKey: "AIzaSyCsRidc0smUQDaBwq-oki5NzxSHx6-ljiw",
    authDomain: "nezuochat.firebaseapp.com",
    databaseURL: "https://nezuochat-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "nezuochat",
    storageBucket: "nezuochat.firebasestorage.app",
    messagingSenderId: "154725381397",
    appId: "1:154725381397:web:8742ccd957e20cee8ce51c"
  };

  // ドメイン確認（ローカルファイル実行や他ドメインへの注意喚起）
  if (window.location.hostname === "") {
    document.getElementById("domainWarning").style.display = "block";
    document.getElementById("domainWarning").textContent = "⚠️ HTMLファイルを直接ローカルで起動しているため、サーバー上のチャットアプリとは異なるUIDが表示されている可能性があります。";
  }

  // Firebaseの初期化
  let finalUid = "";
  if (typeof firebase !== 'undefined') {
    try {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    } catch (e) {
      console.error(e);
    }
  }

  const uidDisplay = document.getElementById("uidDisplay");
  const copyBtn = document.getElementById("copyBtn");
  const statusMessage = document.getElementById("statusMessage");

  // LocalStorageから最優先で読み込み
  let localUid = "";
  try {
    localUid = localStorage.getItem("nz_permanent_uid") || "";
  } catch (e) {
    console.warn("LocalStorageの読み込みに失敗しました", e);
  }

  if (localUid) {
    finalUid = localUid;
    showUid(finalUid, "LocalStorageから読み込みました");
  }

  // Firebase Authからログイン状態を確認・同期
  if (typeof firebase !== 'undefined' && firebase.auth) {
    firebase.auth().onAuthStateChanged((user) => {
      if (user) {
        finalUid = user.uid;
        try {
          localStorage.setItem("nz_permanent_uid", finalUid);
        } catch(e){}
        showUid(finalUid, "Firebase Authセッションと同期しました");
      } else {
        // セッションが切れている場合は匿名ログインを再試行して取得
        statusMessage.textContent = "匿名セッションを再確認中...";
        firebase.auth().signInAnonymously().catch(err => {
          console.error("ログインエラー:", err);
          statusMessage.textContent = "認証エラーが発生しました。";
        });
      }
    });
  } else {
    if (!localUid) {
      uidDisplay.textContent = "UIDが見つかりません。チャットに一度入室してください。";
      statusMessage.textContent = "エラー";
    }
  }

  function showUid(uid, sourceText) {
    uidDisplay.textContent = uid;
    copyBtn.disabled = false;
    statusMessage.textContent = sourceText;
    statusMessage.style.color = "var(--em)";
  }

  // コピー機能
  copyBtn.addEventListener("click", async () => {
    if (!finalUid) return;
    try {
      await navigator.clipboard.writeText(finalUid);
      const originalText = copyBtn.textContent;
      copyBtn.textContent = "コピー成功！";
      copyBtn.style.background = "var(--em)";
      setTimeout(() => {
        copyBtn.textContent = originalText;
        copyBtn.style.background = "";
      }, 2000);
    } catch (err) {
      alert("コピーに失敗しました。手動で選択してコピーしてください。");
    }
  });
</script>
</body>
</html>
